name: QA CI (RAV-280/281/284)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  qa-gates:
    name: Unit + isolation + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: QA CI (critical tests + static isolation)
        env:
          QA_CI_SKIP_BUILD: '1'
        run: npm run qa:ci

  qa-live-db:
    name: RLS + cross-tenant (live DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Live DB isolation tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not configured — skipping live RLS / cross-tenant tests."
            exit 0
          fi
          npm run test:rls
          npm run test:cross-tenant

  qa-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  qa-e2e:
    name: Playwright E2E (credentialed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E
        env:
          QA_CI_E2E: '1'
          E2E_APP_BASE_URL: ${{ vars.E2E_APP_BASE_URL || 'http://localhost:3000' }}
          E2E_CP_BASE_URL: ${{ vars.E2E_CP_BASE_URL || 'http://localhost:3001' }}
          E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL }}
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL || secrets.E2E_DEMO_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD || secrets.E2E_DEMO_PASSWORD }}
          E2E_ESS_EMAIL: ${{ secrets.E2E_ESS_EMAIL }}
          E2E_ESS_PASSWORD: ${{ secrets.E2E_ESS_PASSWORD }}
          E2E_CP_EMAIL: ${{ secrets.E2E_CP_EMAIL }}
          E2E_CP_PASSWORD: ${{ secrets.E2E_CP_PASSWORD }}
        run: |
          if [ -z "$E2E_DEMO_EMAIL" ] || [ -z "$E2E_DEMO_PASSWORD" ]; then
            echo "E2E credentials not configured — skipping Playwright job."
            exit 0
          fi
          npm run test:e2e
