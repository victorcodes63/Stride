name: Tenant isolation (ISO-07)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  iso-gates:
    name: Static tenant isolation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ISO-07 static audits
        run: npm run iso:ci

  iso-live-db:
    name: RLS + cross-tenant (live DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Live DB isolation tests
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          npm run test:rls
          npm run test:cross-tenant
